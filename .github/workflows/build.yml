name: Compilar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: |
          pip install -r requirements.txt pyinstaller
          pip install --no-deps -r requirements-nodeps.txt
      - name: Versión desde la etiqueta
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path version.py -Value "__version__ = `"$v`"" -Encoding utf8
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Compilar .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PhootFlow
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-all rawpy --collect-all pillow_heif --collect-data cv2 --collect-all mediapipe --collect-all onnxruntime
          --hidden-import scene_ai --hidden-import eyes --hidden-import luts --hidden-import studio --hidden-import studio_engine --hidden-import review --hidden-import masks --hidden-import compare --hidden-import edits --hidden-import edits_engine --hidden-import edits_adjust --hidden-import edits_ui --hidden-import zoomview --hidden-import cropview --hidden-import icons --hidden-import ui --hidden-import propagate --hidden-import progress_panel --hidden-import export_formats --hidden-import fx_engine --hidden-import fx_ui --hidden-import graphics_elements --hidden-import graphics_home --hidden-import graphics_online --hidden-import graphics_templates --hidden-import graphics_textfx --hidden-import graphics_textfx_ui --hidden-import license --hidden-import graphics --hidden-import graphics_engine --hidden-import PySide6.QtSvg app.py
      - name: Compilar la versión en carpeta (para el instalador)
        run: >
          pyinstaller --noconfirm --onedir --windowed --name PhootFlow
          --distpath dist_dir --workpath build_dir
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-all rawpy --collect-all pillow_heif --collect-data cv2 --collect-all mediapipe --collect-all onnxruntime
          --hidden-import scene_ai --hidden-import eyes --hidden-import luts --hidden-import studio --hidden-import studio_engine --hidden-import review --hidden-import masks --hidden-import compare --hidden-import edits --hidden-import edits_engine --hidden-import edits_adjust --hidden-import edits_ui --hidden-import zoomview --hidden-import cropview --hidden-import icons --hidden-import ui --hidden-import propagate --hidden-import progress_panel --hidden-import export_formats --hidden-import fx_engine --hidden-import fx_ui --hidden-import graphics_elements --hidden-import graphics_home --hidden-import graphics_online --hidden-import graphics_templates --hidden-import graphics_textfx --hidden-import graphics_textfx_ui --hidden-import license --hidden-import graphics --hidden-import graphics_engine --hidden-import PySide6.QtSvg app.py
      - name: Firmar los ejecutables (si hay certificado)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./instalador/firmar.ps1 -Files dist\PhootFlow.exe, dist_dir\PhootFlow\PhootFlow.exe
      - name: Comprobar que el .exe arranca y procesa
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PhootFlow.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\phootflow_selftest.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Instalador (Inno Setup)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = (python -c "import version; print(version.__version__)").Trim()
          & $iscc /Q "/DMyVersion=$v" "/DSrcDir=$PWD\dist_dir\PhootFlow" "/DOutDir=$PWD\dist" instalador\PhootFlow.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          ./instalador/firmar.ps1 -Files dist\PhootFlow-Setup.exe
      - name: Comprobar el instalador (instalar, abrir, desinstalar)
        shell: pwsh
        run: |
          $p = Start-Process dist\PhootFlow-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "La instalación falló ($($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\PhootFlowApp"
          foreach ($f in "PhootFlow.exe", "unins000.exe") { if (-not (Test-Path "$app\$f")) { throw "Falta $f tras instalar" } }
          if (-not (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "PhootFlow.lnk" -Recurse)) { throw "Falta el acceso directo" }
          $p = Start-Process "$app\PhootFlow.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\phootflow_selftest.log"
          if ($p.ExitCode -ne 0) { throw "La app instalada no pasó el selftest" }
          # actualización automática de verdad: la app instalada lanza el instalador, se cierra, y el instalador
          # sustituye los archivos y la vuelve a abrir (aquí en modo selftest, que escribe su log al terminar)
          $log = "$env:TEMP\phootflow_selftest.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          Start-Process "$app\PhootFlow.exe" -ArgumentList "--actualizar-con", "`"$PWD\dist\PhootFlow-Setup.exe`"" -Wait
          $ok = $false
          for ($i = 0; $i -lt 150; $i++) {
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match "^OK")) { $ok = $true; break }
            Start-Sleep 2
          }
          Get-Content "$env:TEMP\phootflow_instalacion.log" -Tail 12 -ErrorAction SilentlyContinue
          if (-not $ok) { throw "La actualización automática no volvió a abrir la app" }
          Get-Content $log
          Write-Host "Actualización automática: OK"
          Start-Sleep 5
          $p = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "$app\PhootFlow.exe") { throw "La desinstalación dejó el programa" }
          Write-Host "Instalar, abrir y desinstalar: OK"
      - name: Paquete de código (instalación con Python y autoactualización en PCs con Smart App Control)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\PhootFlow | Out-Null
          Copy-Item app.py, export_formats.py, fx_engine.py, fx_ui.py, graphics_elements.py, graphics_home.py, graphics_online.py, graphics_templates.py, graphics_textfx.py, graphics_textfx_ui.py, engine.py, styles.py, luts.py, studio.py, studio_engine.py, review.py, masks.py, compare.py, zoomview.py, cropview.py, icons.py, ui.py, propagate.py, progress_panel.py, session_file.py, session_presets.py, edits.py, edits_engine.py, edits_adjust.py, edits_ui.py, graphics.py, graphics_engine.py, eyes.py, scene_ai.py, theme.py, drive.py, net.py, updater.py, license.py, version.py, requirements.txt, requirements-nodeps.txt, instalar.ps1, README.md pkg\PhootFlow\
          Copy-Item -Recurse assets pkg\PhootFlow\assets
          # que no falte ningún módulo: una instalación «source» sin un .py no arranca
          $faltan = Get-ChildItem *.py | Where-Object { $_.Name -notlike "admin_licencias*" -and -not (Test-Path "pkg\PhootFlow\$($_.Name)") }
          if ($faltan) { throw "Faltan en el paquete de código: $($faltan.Name -join ', ')" }
          Compress-Archive -Path pkg\PhootFlow -DestinationPath dist\PhootFlow-src.zip
      - name: Sumas de verificación
        shell: pwsh
        run: |
          foreach ($f in "PhootFlow-Setup.exe", "PhootFlow.exe", "PhootFlow-src.zip") {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "dist\$f.sha256" -Value $h -NoNewline -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PhootFlow
          path: dist/PhootFlow*
      - name: Publicar release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/PhootFlow-Setup.exe dist/PhootFlow-Setup.exe.sha256 dist/PhootFlow.exe dist/PhootFlow.exe.sha256 dist/PhootFlow-src.zip dist/PhootFlow-src.zip.sha256 instalar.ps1 --title "PhootFlow ${{ github.ref_name }}" --generate-notes
      # El código es privado: las apps instaladas buscan las versiones en este repo público, solo de releases.
      # RELEASES_TOKEN: token fine-grained con «Contents: read and write» solo en phootflow-releases (ver LICENCIAS.md).
      - name: Publicar en el repo público de releases
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:RELEASES_TOKEN) { throw "Falta el secreto RELEASES_TOKEN: las apps instaladas no verían esta versión." }
          gh release view "${{ github.ref_name }}" --json body -q .body | Set-Content -Path notas.md -Encoding utf8
          $env:GH_TOKEN = $env:RELEASES_TOKEN
          gh release create "${{ github.ref_name }}" dist/PhootFlow-Setup.exe dist/PhootFlow-Setup.exe.sha256 dist/PhootFlow.exe dist/PhootFlow.exe.sha256 dist/PhootFlow-src.zip dist/PhootFlow-src.zip.sha256 instalar.ps1 --repo davidcaptart-glitch/phootflow-releases --title "PhootFlow ${{ github.ref_name }}" --notes-file notas.md
