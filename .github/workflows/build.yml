name: Compilar y publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Versión desde la etiqueta
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path version.py -Value "__version__ = `"$v`"" -Encoding utf8
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Compilar .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PhootFlow
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-all rawpy --collect-data cv2 app.py
      - name: Comprobar que el .exe arranca y procesa
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PhootFlow.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\phootflow_selftest.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Paquete de código (instalación con Python y autoactualización en PCs con Smart App Control)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\PhootFlow | Out-Null
          Copy-Item app.py, engine.py, styles.py, theme.py, drive.py, net.py, updater.py, version.py, requirements.txt, instalar.ps1, README.md pkg\PhootFlow\
          Copy-Item -Recurse assets pkg\PhootFlow\assets
          Compress-Archive -Path pkg\PhootFlow -DestinationPath dist\PhootFlow-src.zip
      - name: Sumas de verificación
        shell: pwsh
        run: |
          foreach ($f in "PhootFlow.exe", "PhootFlow-src.zip") {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "dist\$f.sha256" -Value $h -NoNewline -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PhootFlow
          path: dist/PhootFlow*
      - name: Publicar release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/PhootFlow.exe dist/PhootFlow.exe.sha256 dist/PhootFlow-src.zip dist/PhootFlow-src.zip.sha256 --title "PhootFlow ${{ github.ref_name }}" --generate-notes
